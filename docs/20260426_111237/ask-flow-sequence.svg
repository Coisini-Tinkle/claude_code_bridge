<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1100" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowR" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 z" fill="#334155"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 z" fill="#10b981"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="1100" fill="#fafbfc" rx="8"/>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Ask 通信时序图</text>
  <text x="480" y="48" text-anchor="middle" font-size="11" fill="#64748b">Agent A 发送消息给 Agent B 的完整数据流</text>

  <!-- Participants -->
  <rect x="60" y="65" width="130" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="125" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6">Agent A (Claude)</text>

  <rect x="310" y="65" width="130" height="36" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="375" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#0369a1">ccbd Daemon</text>

  <rect x="560" y="65" width="130" height="36" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="625" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">Mailbox / FS</text>

  <rect x="790" y="65" width="130" height="36" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="855" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Agent B (Codex)</text>

  <!-- Lifelines -->
  <line x1="125" y1="101" x2="125" y2="1060" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="375" y1="101" x2="375" y2="1060" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="625" y1="101" x2="625" y2="1060" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="855" y1="101" x2="855" y2="1060" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Phase labels -->
  <rect x="5" y="108" width="48" height="190" rx="4" fill="#ede9fe" stroke="none"/>
  <text x="29" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6" transform="rotate(-90,29,210)">Phase 1: 提交</text>

  <rect x="5" y="308" width="48" height="180" rx="4" fill="#fef3c7" stroke="none"/>
  <text x="29" y="405" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e" transform="rotate(-90,29,405)">Phase 2: 路由</text>

  <rect x="5" y="498" width="48" height="160" rx="4" fill="#ecfdf5" stroke="none"/>
  <text x="29" y="585" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46" transform="rotate(-90,29,585)">Phase 3: 投递</text>

  <rect x="5" y="668" width="48" height="140" rx="4" fill="#eff6ff" stroke="none"/>
  <text x="29" y="745" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af" transform="rotate(-90,29,745)">Phase 4: 回复</text>

  <rect x="5" y="818" width="48" height="230" rx="4" fill="#fef2f2" stroke="none"/>
  <text x="29" y="940" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b" transform="rotate(-90,29,940)">Phase 5: 回送</text>

  <!-- ===== Phase 1: Submit ===== -->
  <!-- Step 1 -->
  <line x1="125" y1="125" x2="375" y2="145" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <rect x="145" y="118" width="200" height="20" rx="3" fill="#fff" fill-opacity="0.9"/>
  <text x="250" y="132" text-anchor="middle" font-size="10" fill="#334155">1. ccb ask agentB "prompt"</text>

  <!-- Step 2 -->
  <line x1="125" y1="155" x2="375" y2="175" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <rect x="140" y="148" width="210" height="20" rx="3" fill="#fff" fill-opacity="0.9"/>
  <text x="250" y="162" text-anchor="middle" font-size="10" fill="#334155">2. Socket RPC: submit(MessageEnvelope)</text>

  <!-- Step 3 - return async -->
  <line x1="375" y1="195" x2="125" y2="215" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowR)"/>
  <rect x="155" y="188" width="200" height="20" rx="3" fill="#fff" fill-opacity="0.9"/>
  <text x="250" y="202" text-anchor="middle" font-size="10" fill="#8b5cf6">3. [CCB_ASYNC_SUBMITTED] job_id</text>

  <!-- ===== Phase 2: Routing ===== -->
  <!-- Step 4 -->
  <line x1="375" y1="235" x2="375" y2="270" stroke="#0ea5e9" stroke-width="1.5"/>
  <circle cx="375" cy="270" r="3" fill="#0ea5e9"/>
  <rect x="385" y="235" width="180" height="16" rx="3" fill="#fff" fill-opacity="0.9"/>
  <text x="475" y="247" font-size="10" fill="#0369a1">4. submit_handler → dispatcher</text>

  <!-- Step 5 -->
  <line x1="375" y1="280" x2="625" y2="310" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <rect x="395" y="280" width="210" height="16" rx="3" fill="#fff" fill-opacity="0.9"/>
  <text x="500" y="292" font-size="10" fill="#065f46">5. 创建 JobRecord → jobs.jsonl</text>

  <!-- Step 6 -->
  <line x1="375" y1="315" x2="625" y2="345" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <rect x="395" y="315" width="220" height="16" rx="3" fill="#fff" fill-opacity="0.9"/>
  <text x="500" y="327" font-size="10" fill="#065f46">6. TASK_REQUEST → inbox.jsonl (Agent B)</text>

  <!-- Step 7 -->
  <line x1="375" y1="355" x2="625" y2="380" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <rect x="395" y="355" width="220" height="16" rx="3" fill="#fff" fill-opacity="0.9"/>
  <text x="500" y="367" font-size="10" fill="#065f46">7. MessageRecord / AttemptRecord 记录</text>

  <!-- Step 8 -->
  <line x1="625" y1="395" x2="625" y2="425" stroke="#10b981" stroke-width="1"/>
  <rect x="635" y="395" width="180" height="16" rx="3" fill="#fff" fill-opacity="0.9"/>
  <text x="725" y="407" font-size="10" fill="#065f46">8. 更新 mailbox.json 状态</text>

  <!-- Step 9 -->
  <line x1="375" y1="435" x2="375" y2="465" stroke="#0ea5e9" stroke-width="1.5"/>
  <circle cx="375" cy="465" r="3" fill="#0ea5e9"/>
  <rect x="385" y="435" width="180" height="16" rx="3" fill="#fff" fill-opacity="0.9"/>
  <text x="475" y="447" font-size="10" fill="#0369a1">9. dispatcher tick() 触发执行</text>

  <!-- ===== Phase 3: Delivery ===== -->
  <!-- Step 10 -->
  <line x1="375" y1="480" x2="625" y2="505" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <rect x="400" y="478" width="210" height="16" rx="3" fill="#fff" fill-opacity="0.9"/>
  <text x="500" y="490" font-size="10" fill="#065f46">10. claim_next() 获取投递租约</text>

  <!-- Step 11 -->
  <line x1="375" y1="520" x2="855" y2="545" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="470" y="518" width="260" height="16" rx="3" fill="#fff" fill-opacity="0.9"/>
  <text x="600" y="530" font-size="10" fill="#1e40af">11. comm.send_text() 注入到 tmux pane</text>

  <!-- Step 11 detail -->
  <rect x="770" y="555" width="165" height="45" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="852" y="572" text-anchor="middle" font-size="9" fill="#1e40af">Prompt 格式:</text>
  <text x="852" y="585" text-anchor="middle" font-size="8" fill="#3b82f6">CCB_REQ_ID: 20260426-...</text>
  <text x="852" y="596" text-anchor="middle" font-size="8" fill="#3b82f6">CCB_DONE: req_id</text>

  <!-- Step 12 - AI processing -->
  <rect x="820" y="610" width="80" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="860" y="628" text-anchor="middle" font-size="10" fill="#1e40af">12. Codex</text>
  <text x="860" y="642" text-anchor="middle" font-size="10" fill="#1e40af">处理中...</text>

  <!-- ===== Phase 4: Completion ===== -->
  <!-- Step 13 -->
  <line x1="855" y1="665" x2="375" y2="690" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowB)"/>
  <rect x="470" y="660" width="260" height="16" rx="3" fill="#fff" fill-opacity="0.9"/>
  <text x="600" y="672" font-size="10" fill="#1e40af">13. 检测 CCB_DONE 标记 → 提取回复</text>

  <!-- Step 14 -->
  <line x1="375" y1="705" x2="625" y2="730" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <rect x="400" y="703" width="200" height="16" rx="3" fill="#fff" fill-opacity="0.9"/>
  <text x="500" y="715" font-size="10" fill="#065f46">14. ReplyRecord → replies.jsonl</text>

  <!-- Step 15 -->
  <line x1="375" y1="745" x2="625" y2="770" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <rect x="400" y="743" width="220" height="16" rx="3" fill="#fff" fill-opacity="0.9"/>
  <text x="510" y="755" font-size="10" fill="#065f46">15. TASK_REPLY → inbox.jsonl (Agent A)</text>

  <!-- ===== Phase 5: Reply Delivery ===== -->
  <!-- Step 16 -->
  <line x1="375" y1="800" x2="375" y2="830" stroke="#0ea5e9" stroke-width="1.5"/>
  <circle cx="375" cy="830" r="3" fill="#0ea5e9"/>
  <rect x="385" y="800" width="200" height="16" rx="3" fill="#fff" fill-opacity="0.9"/>
  <text x="485" y="812" font-size="10" fill="#0369a1">16. tick: 准备回复投递</text>

  <!-- Step 17 -->
  <line x1="375" y1="845" x2="625" y2="865" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <rect x="400" y="840" width="210" height="16" rx="3" fill="#fff" fill-opacity="0.9"/>
  <text x="505" y="852" font-size="10" fill="#065f46">17. claim Agent A 的 TASK_REPLY</text>

  <!-- Step 18 -->
  <line x1="375" y1="885" x2="125" y2="910" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowR)"/>
  <rect x="155" y="883" width="210" height="16" rx="3" fill="#fff" fill-opacity="0.9"/>
  <text x="260" y="895" font-size="10" fill="#5b21b6">18. 注入回复到 Agent A 的 tmux pane</text>

  <!-- Step 19 -->
  <line x1="375" y1="930" x2="625" y2="955" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <rect x="400" y="928" width="210" height="16" rx="3" fill="#fff" fill-opacity="0.9"/>
  <text x="505" y="940" font-size="10" fill="#065f46">19. ack_reply() → CONSUMED</text>

  <!-- Step 20 -->
  <rect x="80" y="975" width="90" height="30" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="125" y="994" text-anchor="middle" font-size="10" fill="#5b21b6">20. 收到回复</text>

  <!-- ===== Async path note ===== -->
  <rect x="700" y="975" width="240" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="820" y="995" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">查看回复的方式</text>
  <text x="820" y="1012" text-anchor="middle" font-size="10" fill="#a16207">async: ccb pend {agent}</text>
  <text x="820" y="1028" text-anchor="middle" font-size="10" fill="#a16207">sync: --wait 自动阻塞等待</text>

  <!-- Bottom note -->
  <rect x="60" y="1055" width="840" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="480" y="1074" text-anchor="middle" font-size="10" fill="#64748b">所有持久化均为 append-only JSONL · daemon 崩溃后可从文件恢复 mailbox 状态 · 回复投递依赖 tick 轮询（非推送）</text>
</svg>
